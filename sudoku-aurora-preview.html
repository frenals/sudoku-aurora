<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sudoku Aurora · 交互预览</title>
<style>
:root{
  --bg:#0A0E1F; --card:#141B33; --card-top:#1C2545; --stroke:#2C3760;
  --text:#EAF0FF; --muted:#8B98C2; --dim:#5C6890;
  --primary:#7C5CFF; --accent:#2DD4BF; --pink:#FF6B9D; --wrong:#FF6B7A;
  --given:#E9EEFF; --user:#63E6D2; --note:#8492BC;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- animated aurora ---------- */
.aurora{position:fixed;inset:0;overflow:hidden;pointer-events:none;
  background:linear-gradient(180deg,#0A0E1F 0%,#0C1026 55%,#070A16 100%);}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;
  animation:drift 20s ease-in-out infinite alternate;}
.o1{width:560px;height:560px;top:-180px;left:-140px;
  background:radial-gradient(circle,rgba(124,92,255,.85),transparent 70%);}
.o2{width:480px;height:480px;top:34%;right:-180px;animation-duration:24s;
  background:radial-gradient(circle,rgba(45,212,191,.6),transparent 70%);}
.o3{width:420px;height:420px;bottom:-190px;left:18%;animation-duration:28s;
  background:radial-gradient(circle,rgba(255,107,157,.45),transparent 70%);}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(70px,60px) scale(1.18)}}
.stars{position:absolute;inset:0;opacity:.55;
  background-image:
    radial-gradient(1px 1px at 12% 18%,#cfe0ff,transparent),
    radial-gradient(1px 1px at 78% 12%,#cfe0ff,transparent),
    radial-gradient(1px 1px at 35% 62%,#cfe0ff,transparent),
    radial-gradient(1px 1px at 88% 74%,#cfe0ff,transparent),
    radial-gradient(1px 1px at 58% 88%,#cfe0ff,transparent),
    radial-gradient(1px 1px at 22% 82%,#cfe0ff,transparent),
    radial-gradient(1px 1px at 66% 34%,#cfe0ff,transparent),
    radial-gradient(1px 1px at 45% 8%,#cfe0ff,transparent);
  animation:twinkle 4s ease-in-out infinite alternate;}
@keyframes twinkle{from{opacity:.25}to{opacity:.7}}

/* ---------- shell ---------- */
.app{position:relative;max-width:430px;height:100vh;margin:0 auto;
  padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px;}
header{display:flex;align-items:center;justify-content:space-between}
.brand h1{font-size:25px;font-weight:800;letter-spacing:.16em;line-height:1}
.brand p{font-size:9px;font-weight:800;letter-spacing:.26em;color:var(--accent);margin-top:4px}
.chip{background:rgba(26,34,66,.85);border:1px solid var(--stroke);border-radius:12px;
  padding:7px 12px;font:700 15px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.06em;min-width:78px;text-align:center}

/* ---------- segmented control ---------- */
.seg{position:relative;height:38px;background:var(--card);border-radius:12px;
  border:1px solid rgba(44,55,96,.6);display:flex;overflow:hidden}
.seg-ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);
  border-radius:9px;background:linear-gradient(90deg,#7C5CFF,#5F8BFF,#2DD4BF);
  box-shadow:0 0 18px rgba(124,92,255,.45);
  transition:transform .32s cubic-bezier(.2,.9,.3,1.25);}
.seg button{position:relative;z-index:1;flex:1;font-size:11px;font-weight:800;
  letter-spacing:.12em;color:var(--muted);transition:color .25s}
.seg button.on{color:#fff}

/* ---------- progress + status ---------- */
.row{display:flex;align-items:center;gap:10px}
.label{font-size:9px;font-weight:800;letter-spacing:.16em;color:var(--muted);white-space:nowrap}
.track{flex:1;height:6px;background:#222C50;border-radius:6px;overflow:hidden}
.fill{height:100%;width:0;border-radius:6px;
  background:linear-gradient(90deg,#7C5CFF,#5F8BFF,#2DD4BF);
  transition:width .32s cubic-bezier(.2,.8,.3,1)}
.count{font:700 10px/1 ui-monospace,monospace;color:var(--accent);width:44px;text-align:right}
.toggle{background:rgba(22,30,58,.9);border:1px solid var(--stroke);border-radius:12px;
  padding:6px 11px;font-size:9px;font-weight:800;letter-spacing:.1em;color:var(--muted);
  transition:all .25s;white-space:nowrap}
.toggle.on{color:var(--accent);border-color:var(--primary);background:rgba(44,58,107,.9)}
.mistakes{font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--muted)}
.mistakes.flash{color:var(--wrong);animation:shakeM .45s ease}
@keyframes shakeM{0%,100%{transform:scale(1)}25%{transform:scale(1.28)}60%{transform:scale(.95)}}

/* ---------- board ---------- */
.card{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
  padding:5px;border-radius:20px;border:1px solid var(--stroke);
  background:linear-gradient(180deg,var(--card-top),var(--card));
  box-shadow:0 18px 40px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.02) inset;}
.board{height:100%;aspect-ratio:1/1;max-width:100%;border-radius:14px;overflow:hidden;
  background:#101731;display:grid;grid-template-columns:repeat(9,1fr);
  grid-template-rows:repeat(9,1fr);}
.cell{position:relative;display:flex;align-items:center;justify-content:center;
  border-right:1px solid #2A3560;border-bottom:1px solid #2A3560;
  transition:background .2s,box-shadow .2s;cursor:pointer;user-select:none;}
.cell.r8{border-right:none}.cell.b8{border-bottom:none}
.cell.bl{border-left:2px solid #5266A8}.cell.bt{border-top:2px solid #5266A8}
.cell.br{border-right:2px solid #5266A8}.cell.bb{border-bottom:2px solid #5266A8}
.cell.peer{background:#1A2444}
.cell.same{background:#244A72}
.cell.sel{background:#33437F;box-shadow:inset 0 0 0 2px #7C5CFF,0 0 16px rgba(124,92,255,.35);z-index:2}
.cell.conflict{background:#4A2036}
.digit{font-size:clamp(16px,4.4vh,30px);font-weight:700;line-height:1}
.digit.given{color:var(--given);font-weight:800}
.digit.user{color:var(--user)}
.digit.wrong{color:var(--wrong)}
.digit.pop{animation:pop .34s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
.notes{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  width:100%;height:100%;padding:2px}
.notes span{display:flex;align-items:center;justify-content:center;
  font-size:clamp(7px,1.25vh,11px);color:var(--note);line-height:1}
.cell.reveal{animation:reveal .3s ease-out both}
@keyframes reveal{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:scale(1)}}

/* ---------- actions ---------- */
.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.act{height:58px;border-radius:12px;border:1px solid var(--stroke);
  background:#161E3A;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;font-size:9px;font-weight:800;letter-spacing:.08em;
  color:var(--muted);transition:transform .12s,background .2s,border-color .2s,color .2s}
.act svg{width:19px;height:19px;fill:currentColor}
.act:hover{border-color:#3D4C82}
.act:active{transform:scale(.9)}
.act.on{background:#2C3A6B;border-color:var(--primary);color:var(--accent)}
.act.dim{opacity:.42}
.act.spring{animation:spring .42s cubic-bezier(.2,1.3,.4,1)}
@keyframes spring{0%{transform:scale(.86)}45%{transform:scale(1.08)}75%{transform:scale(.97)}100%{transform:scale(1)}}

/* ---------- number pad ---------- */
.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;height:66px}
.key{position:relative;border-radius:11px;border:1px solid #33416E;background:#1B2444;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;transition:transform .12s,background .2s,border-color .2s;overflow:hidden}
.key b{font-size:22px;font-weight:800;line-height:1;color:var(--text)}
.key small{font-size:8px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.key.active{background:linear-gradient(120deg,#7C5CFF,#5F8BFF,#2DD4BF);
  border-color:rgba(255,255,255,.4);box-shadow:0 0 16px rgba(124,92,255,.45)}
.key.active small{color:#EAF0FF}
.key.done{background:#131A31;opacity:.55}
.key.done small{color:#3F8F7E}
.key:active{transform:scale(.86)}
.key.spring{animation:spring .42s cubic-bezier(.2,1.3,.4,1)}
.tip{text-align:center;font-size:9px;color:var(--dim);letter-spacing:.06em;line-height:1.5}

/* ---------- overlays ---------- */
.hidden{display:none!important}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(6,10,24,.8);
  backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px}
.win-card{width:300px;border-radius:24px;padding:26px;text-align:center;
  background:linear-gradient(315deg,#202B52,#141B33);border:1px solid #4A5A94;
  box-shadow:0 24px 60px rgba(0,0,0,.6);
  animation:cardIn .52s cubic-bezier(.2,1.4,.4,1)}
@keyframes cardIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.win-card .star{font-size:40px;color:var(--accent);line-height:1}
.win-card h2{font-size:21px;letter-spacing:.14em;margin-top:4px}
.win-stats{margin-top:16px;font-size:12px;line-height:2;color:var(--muted);
  white-space:pre-line;font-family:ui-monospace,monospace}
.win-btns{display:flex;gap:10px;margin-top:22px}
.win-btns button{flex:1;height:42px;border-radius:12px;font-size:10px;font-weight:800;letter-spacing:.12em}
.btn-ghost{background:#1A2242;border:1px solid var(--stroke);color:var(--muted)}
.btn-go{background:linear-gradient(120deg,#7C5CFF,#2DD4BF);color:#fff}
.menu{width:270px;border-radius:20px;padding:18px;
  background:linear-gradient(315deg,#202B52,#141B33);border:1px solid #4A5A94;
  box-shadow:0 24px 60px rgba(0,0,0,.6);animation:cardIn .35s ease-out}
.menu h3{font-size:13px;letter-spacing:.12em;margin-bottom:12px;color:var(--muted)}
.menu button{width:100%;text-align:left;padding:12px 14px;border-radius:12px;
  background:#1A2242;border:1px solid var(--stroke);margin-bottom:8px;
  font-size:12px;font-weight:700}
.menu button:hover{border-color:var(--primary)}
#confetti{position:fixed;inset:0;z-index:30;pointer-events:none}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);
  z-index:40;background:rgba(28,37,69,.95);border:1px solid var(--stroke);
  border-radius:12px;padding:10px 18px;font-size:11px;font-weight:700;
  letter-spacing:.08em;color:var(--text);opacity:0;transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="aurora">
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
  <div class="stars"></div>
</div>

<div class="app">
  <header>
    <div class="brand"><h1>SUDOKU</h1><p>AURORA EDITION</p></div>
    <div class="chip" id="timer">00:00</div>
  </header>

  <div class="seg" id="seg">
    <div class="seg-ind" id="segInd"></div>
    <button class="on" data-d="0">EASY</button>
    <button data-d="1">MEDIUM</button>
    <button data-d="2">HARD</button>
  </div>

  <div class="row">
    <span class="label">PROGRESS</span>
    <div class="track"><div class="fill" id="fill"></div></div>
    <span class="count" id="count">0/81</span>
  </div>

  <div class="row">
    <span class="mistakes" id="mistakes">MISTAKES&nbsp; 0</span>
    <span style="flex:1"></span>
    <button class="toggle" id="autoCheck">AUTO-CHECK&nbsp; OFF</button>
  </div>

  <div class="card"><div class="board" id="board"></div></div>

  <div class="actions" id="actions">
    <button class="act" data-a="undo"><svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>UNDO</button>
    <button class="act" data-a="erase"><svg viewBox="0 0 24 24"><path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11C5.77 20.65 6.31 21 7 21h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM19 15.59L17.59 17 14 13.41 10.41 17 9 15.59 12.59 12 9 8.41 10.41 7 14 10.59 17.59 7 19 8.41 15.41 12 19 15.59z"/></svg>ERASE</button>
    <button class="act" data-a="notes"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>NOTES</button>
    <button class="act" data-a="hint"><svg viewBox="0 0 24 24"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7zm2 11h-4v-1h4v1zm.5-2.32l-.5.36V14h-4v-.96l-.5-.36C8.82 12.06 8 10.91 8 9.5 8 7.57 9.79 6 12 6s4 1.57 4 3.5c0 1.41-.82 2.56-1.5 3.18z"/></svg>HINT</button>
    <button class="act" data-a="new"><svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>NEW</button>
  </div>

  <div class="pad" id="pad"></div>
  <div class="tip">1-9 输入 · 方向键移动 · N 笔记 · H 提示 · U 撤销 · Delete 擦除</div>
</div>

<!-- win -->
<div class="overlay hidden" id="winOverlay">
  <div class="win-card">
    <div class="star">✦</div>
    <h2>PUZZLE SOLVED</h2>
    <div class="win-stats" id="winStats"></div>
    <div class="win-btns">
      <button class="btn-ghost" id="winClose">CLOSE</button>
      <button class="btn-go" id="winAgain">PLAY AGAIN</button>
    </div>
  </div>
</div>

<!-- new game menu -->
<div class="overlay hidden" id="menuOverlay">
  <div class="menu">
    <h3>NEW GAME</h3>
    <button data-d="0">Easy · 40 clues</button>
    <button data-d="1">Medium · 33 clues</button>
    <button data-d="2">Hard · 27 clues</button>
  </div>
</div>

<canvas id="confetti"></canvas>
<div class="toast" id="toast"></div>

<script>
/* ============ puzzle engine (unique-solution generator) ============ */
const CLUES=[40,33,27], NAMES=['EASY','MEDIUM','HARD'];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function ok(b,i,v){
  const r=Math.floor(i/9),c=i%9;
  for(let k=0;k<9;k++){
    if(b[r*9+k]===v||b[k*9+c]===v)return false;
  }
  const br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;
  for(let x=br;x<br+3;x++)for(let y=bc;y<bc+3;y++)if(b[x*9+y]===v)return false;
  return true;
}
function fill(b,pos){
  if(pos===81)return true;
  for(const v of shuffle([1,2,3,4,5,6,7,8,9])){
    if(ok(b,pos,v)){b[pos]=v;if(fill(b,pos+1))return true;b[pos]=0;}
  }
  return false;
}
function countSol(b,pos,limit){
  if(limit<=0)return 0;
  while(pos<81&&b[pos]!==0)pos++;
  if(pos===81)return 1;
  let n=0;
  for(let v=1;v<=9;v++){
    if(ok(b,pos,v)){b[pos]=v;n+=countSol(b,pos+1,limit-n);b[pos]=0;if(n>=limit)break;}
  }
  return n;
}
function generate(d){
  const sol=new Array(81).fill(0); fill(sol,0);
  const p=sol.slice(); let blanks=0, target=81-CLUES[d];
  for(const i of shuffle([...Array(81).keys()])){
    if(blanks>=target)break;
    const s=p[i]; p[i]=0;
    if(countSol(p,0,2)===1)blanks++; else p[i]=s;
  }
  return {puzzle:p,solution:sol};
}

/* ============ state ============ */
let solution,givens,values,notes,selected=-1,noteMode=false,autoCheck=false;
let mistakes=0,hints=0,difficulty=0,elapsed=0,startTs=0,running=false,solved=false;
let undoStack=[],lastMistakes=0;
const cells=[],keys=[];
const $=id=>document.getElementById(id);

function buildBoard(){
  const board=$('board'); board.innerHTML=''; cells.length=0;
  for(let i=0;i<81;i++){
    const r=Math.floor(i/9),c=i%9;
    const d=document.createElement('div');
    let cls='cell';
    if(c===0||c===3||c===6)cls+=' bl';
    if(r===0||r===3||r===6)cls+=' bt';
    if(c===2||c===5)cls+=' br';
    if(r===2||r===5)cls+=' bb';
    if(c===8)cls+=' r8';
    if(r===8)cls+=' b8';
    d.className=cls; d.dataset.i=i;
    d.addEventListener('click',()=>selectCell(i));
    board.appendChild(d); cells.push(d);
  }
}
function buildPad(){
  const pad=$('pad'); pad.innerHTML=''; keys.length=0;
  for(let d=1;d<=9;d++){
    const k=document.createElement('button'); k.className='key'; k.dataset.d=d;
    k.addEventListener('click',()=>{spring(k);input(d);});
    pad.appendChild(k); keys.push(k);
  }
}
function spring(el){el.classList.remove('spring');void el.offsetWidth;el.classList.add('spring');
  setTimeout(()=>el.classList.remove('spring'),450);}

function peer(a,b){
  const ra=Math.floor(a/9),ca=a%9,rb=Math.floor(b/9),cb=b%9;
  return ra===rb||ca===cb||(Math.floor(ra/3)===Math.floor(rb/3)&&Math.floor(ca/3)===Math.floor(cb/3));
}
function conflict(i){
  const v=values[i]; if(!v)return false;
  for(let j=0;j<81;j++)if(j!==i&&values[j]===v&&peer(i,j))return true;
  return false;
}
function wrong(i){return autoCheck&&values[i]!==0&&values[i]!==solution[i];}
function remaining(d){let n=0;for(const v of values)if(v===d)n++;return Math.max(0,9-n);}

/* ============ rendering ============ */
function render(){
  const selVal=selected>=0?values[selected]:0;
  for(let i=0;i<81;i++){
    const el=cells[i], r=Math.floor(i/9), c=i%9;
    let cls='cell';
    if(c===0||c===3||c===6)cls+=' bl';
    if(r===0||r===3||r===6)cls+=' bt';
    if(c===2||c===5)cls+=' br';
    if(r===2||r===5)cls+=' bb';
    if(c===8)cls+=' r8'; if(r===8)cls+=' b8';
    if(selected>=0){
      if(i===selected)cls+=' sel';
      else if(selVal!==0&&values[i]===selVal)cls+=' same';
      else if(peer(i,selected))cls+=' peer';
    }
    if(conflict(i)||wrong(i))cls+=' conflict';
    el.className=cls;
    const v=values[i];
    if(v!==0){
      const kind=givens[i]?'given':'user';
      el.innerHTML=`<span class="digit ${kind}${wrong(i)||conflict(i)?' wrong':''}">${v}</span>`;
    }else{
      const mask=notes[i]; let html='<div class="notes">';
      for(let n=1;n<=9;n++)html+=`<span>${(mask&(1<<(n-1)))?n:''}</span>`;
      el.innerHTML=html+'</div>';
    }
  }
  updatePad(); updateHud();
}
function updatePad(){
  const selVal=selected>=0?values[selected]:0;
  keys.forEach((k,i)=>{
    const d=i+1, rem=remaining(d);
    k.classList.toggle('active',selVal===d&&rem>0);
    k.classList.toggle('done',rem===0);
    k.innerHTML=`<b>${d}</b><small>${rem===0?'✓':rem+' left'}</small>`;
  });
}
function updateHud(){
  const filled=values.filter(v=>v!==0).length;
  $('count').textContent=filled+'/81';
  $('fill').style.width=(filled/81*100)+'%';
  $('mistakes').innerHTML='MISTAKES&nbsp; '+(autoCheck?mistakes:'–');
  $('autoCheck').textContent='AUTO-CHECK  '+(autoCheck?'ON':'OFF');
  $('autoCheck').classList.toggle('on',autoCheck);
  document.querySelectorAll('.act').forEach(b=>{
    b.classList.toggle('on',b.dataset.a==='notes'&&noteMode);
    b.classList.toggle('dim',b.dataset.a==='undo'&&undoStack.length===0);
  });
  $('segInd').style.transform=`translateX(${difficulty*100}%)`;
  document.querySelectorAll('#seg button').forEach((b,i)=>b.classList.toggle('on',i===difficulty));
}
function fmt(ms){
  const t=Math.floor(ms/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;
  return h>0?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
            :`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1400);
}

/* ============ actions ============ */
function pushUndo(){undoStack.push({values:values.slice(),notes:notes.slice(),mistakes,hints,solved});
  if(undoStack.length>400)undoStack.shift();}
function clearPeerNotes(i,v){
  const bit=1<<(v-1),r=Math.floor(i/9),c=i%9;
  for(let k=0;k<9;k++){notes[r*9+k]&=~bit;notes[k*9+c]&=~bit;}
  const br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;
  for(let x=br;x<br+3;x++)for(let y=bc;y<bc+3;y++)notes[x*9+y]&=~bit;
}
function selectCell(i){selected=i;render();}
function input(d){
  if(solved)return;
  if(selected<0){toast('TAP A CELL FIRST');return;}
  if(givens[selected]){toast("THAT'S A GIVEN CLUE");return;}
  const cell=selected;
  if(noteMode&&values[cell]!==0)return;   // pencil marks only on empty cells
  pushUndo();
  if(noteMode){
    notes[cell]^=1<<(d-1);
  }else{
    const nv=values[cell]===d?0:d; values[cell]=nv;
    if(nv){clearPeerNotes(cell,nv);if(autoCheck&&nv!==solution[cell]){mistakes++;flashMistakes();}}
  }
  checkSolved(); render(); animateCell(cell);
}
function animateCell(i){
  const sp=cells[i].querySelector('.digit');
  if(sp){sp.classList.remove('pop');void sp.offsetWidth;sp.classList.add('pop');}
}
function flashMistakes(){
  const m=$('mistakes'); m.classList.remove('flash');void m.offsetWidth;m.classList.add('flash');
  setTimeout(()=>m.classList.remove('flash'),500);
}
function erase(){
  if(solved||selected<0||givens[selected])return;
  if(values[selected]===0&&notes[selected]===0)return;
  pushUndo(); values[selected]=0; notes[selected]=0; render();
}
function undo(){
  if(!undoStack.length)return;
  const s=undoStack.pop();
  values=s.values;notes=s.notes;mistakes=s.mistakes;hints=s.hints;solved=s.solved;
  if(solved)$('winOverlay').classList.add('hidden');
  render();
}
function hint(){
  if(solved)return;
  let cell=selected;
  if(cell<0||givens[cell]||values[cell]===solution[cell]){
    cell=values.findIndex((v,i)=>v!==solution[i]);
    if(cell<0)return;
  }
  pushUndo(); values[cell]=solution[cell];notes[cell]=0;clearPeerNotes(cell,solution[cell]);
  hints++;selected=cell;checkSolved();render();animateCell(cell);
}
function checkSolved(){
  if(values.every((v,i)=>v===solution[i])){solved=true;running=false;showWin();}
}
function move(dr,dc){
  if(selected<0){selected=40;}else{
    const r=(Math.floor(selected/9)+dr+9)%9,c=(selected%9+dc+9)%9;
    selected=r*9+c;
  }
  render();
}
function newGame(d){
  difficulty=d;
  const g=generate(d);
  solution=g.solution;givens=g.puzzle.slice();values=g.puzzle.slice();
  notes=new Array(81).fill(0);
  selected=-1;noteMode=false;mistakes=0;hints=0;elapsed=0;startTs=Date.now();
  running=true;solved=false;undoStack=[];lastMistakes=0;
  $('winOverlay').classList.add('hidden');
  render();
  // staggered reveal for givens
  cells.forEach((el,i)=>{
    el.classList.remove('reveal');
    if(givens[i]===0)return;
    el.style.animationDelay=((Math.floor(i/9)+i%9)*22)+'ms';
    void el.offsetWidth; el.classList.add('reveal');
  });
  toast(NAMES[d]+' PUZZLE READY');
}

/* ============ win + confetti ============ */
function showWin(){
  $('winStats').textContent=
    `DIFFICULTY    ${NAMES[difficulty]}\nTIME               ${fmt(elapsed)}\nHINTS USED    ${hints}\nMISTAKES        ${mistakes}`;
  $('winOverlay').classList.remove('hidden');
  burst();
}
const cv=$('confetti'),ctx=cv.getContext('2d');
let parts=[],confActive=false,confStart=0;
function resize(){cv.width=window.innerWidth;cv.height=window.innerHeight;}
window.addEventListener('resize',resize);resize();
function burst(){
  const colors=['#7C5CFF','#2DD4BF','#FF6B9D','#FFD166','#5F8BFF','#EAF0FF'];
  parts=[];
  for(let i=0;i<140;i++)parts.push({
    x:Math.random()*cv.width, y:-24-Math.random()*cv.height*.7,
    vx:(Math.random()-.5)*110, vy:160+Math.random()*260,
    s:4+Math.random()*7, rot:Math.random()*360, vr:(Math.random()-.5)*520,
    c:colors[Math.floor(Math.random()*colors.length)], shape:Math.floor(Math.random()*3),
    delay:Math.random()*.55
  });
  confStart=performance.now();confActive=true;requestAnimationFrame(drawConf);
}
function drawConf(now){
  if(!confActive)return;
  const age=(now-confStart)/1000,dt=1/60;
  ctx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{
    const a=age-p.delay;if(a<0)return;
    p.vy+=300*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;p.vx*=(1-.35*dt);
    let alpha=a>2.3?Math.max(0,1-(a-2.3)/1.2):1;
    if(alpha<=0||p.y>cv.height+30)return;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);
    ctx.globalAlpha=alpha;ctx.fillStyle=p.c;
    if(p.shape===0)ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
    else if(p.shape===1){ctx.beginPath();ctx.arc(0,0,p.s/2,0,7);ctx.fill();}
    else ctx.fillRect(-p.s/4,-p.s/2,p.s/2,p.s);
    ctx.restore();
  });
  if(now-confStart<3600)requestAnimationFrame(drawConf);
  else{confActive=false;ctx.clearRect(0,0,cv.width,cv.height);}
}

/* ============ wiring ============ */
buildBoard();buildPad();
$('seg').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  newGame(+b.dataset.d);
});
$('actions').addEventListener('click',e=>{
  const b=e.target.closest('.act');if(!b)return;
  spring(b);
  ({undo,erase,hint,new:()=>$('menuOverlay').classList.remove('hidden'),
    notes:()=>{noteMode=!noteMode;toast(noteMode?'PENCIL MARKS ON':'PENCIL MARKS OFF');render();}
  })[b.dataset.a]();
});
$('autoCheck').addEventListener('click',()=>{
  autoCheck=!autoCheck;toast(autoCheck?'AUTO-CHECK ON':'AUTO-CHECK OFF');render();
});
$('menuOverlay').addEventListener('click',e=>{
  if(e.target.id==='menuOverlay'){$('menuOverlay').classList.add('hidden');return;}
  const b=e.target.closest('button');if(!b)return;
  $('menuOverlay').classList.add('hidden');newGame(+b.dataset.d);
});
$('winClose').addEventListener('click',()=>$('winOverlay').classList.add('hidden'));
$('winAgain').addEventListener('click',()=>{
  $('winOverlay').classList.add('hidden');$('menuOverlay').classList.remove('hidden');
});
document.addEventListener('keydown',e=>{
  if(!$('menuOverlay').classList.contains('hidden'))return;
  if(e.key>='1'&&e.key<='9'){input(+e.key);e.preventDefault();return;}
  const map={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]};
  if(map[e.key]){move(...map[e.key]);e.preventDefault();return;}
  const k=e.key.toLowerCase();
  if(k==='delete'||k==='backspace'){erase();e.preventDefault();}
  else if(k==='n'||k===' '){noteMode=!noteMode;render();e.preventDefault();}
  else if(k==='h'){hint();e.preventDefault();}
  else if(k==='u'||(k==='z'&&e.ctrlKey)){undo();e.preventDefault();}
});
setInterval(()=>{
  if(running&&!solved){elapsed=Date.now()-startTs;$('timer').textContent=fmt(elapsed);}
},1000);

newGame(0);
</script>
