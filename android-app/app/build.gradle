plugins {
    id 'com.android.application'
}

android {
    namespace 'com.workbuddy.sudoku'
    compileSdk 34

    defaultConfig {
        applicationId 'com.workbuddy.sudoku'
        minSdk 21
        targetSdk 34
        multiDexEnabled true
        versionCode 2
        versionName '2.0-aurora'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
