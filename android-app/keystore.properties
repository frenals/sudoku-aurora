# Persistent signing key for Sudoku Aurora.
# These are the standard Android debug credentials (public by design). The
# keystore file is committed so every build shares one signing certificate,
# which is what lets a new APK install on top of an older one.
# DO NOT change storeFile/keyAlias unless you intend to break upgrades for
# existing users. See README.md -> "Signing & security".
storeFile=keystore/sudoku-aurora.keystore
storePassword=android
keyAlias=androiddebugkey
keyPassword=android
